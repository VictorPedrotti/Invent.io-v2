spring:
  application:
    name: api-gateway 

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      service: api-gateway  

logging:
  level:
    root: INFO
    "[com.invent.io]": DEBUG
  file:
    name: ./logs/api-gateway.log  
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"