services:
  keycloak-mysql:
    container_name: keycloak-mysql
    image: mysql:8
    volumes:
      - ./volume-data/mysql_keycloak_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: keycloak
      MYSQL_USER: keycloak
      MYSQL_PASSWORD: password
    restart: unless-stopped

  keycloak:
    container_name: keycloak
    image: quay.io/keycloak/keycloak:26.0.2
    command: [ "start-dev" ]
    environment:
      DB_VENDOR: MYSQL
      DB_ADDR: keycloak-mysql
      DB_DATABASE: keycloak
      DB_USER: keycloak
      DB_PASSWORD: password
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HOSTNAME: localhost
      KC_HTTP_PORT: 8080
    ports:
      - "8181:8080"
    volumes:
      - ./docker/keycloak/realms/:/opt/keycloak/data/import/
    depends_on:
      - keycloak-mysql
    restart: unless-stopped

  user-db:
    image: mysql:latest
    container_name: user-db
    environment:
      MYSQL_DATABASE: user_service_db
      MYSQL_USER: user_service
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - user-db-data:/var/lib/mysql
    restart: unless-stopped

  procurement-db:
    image: mysql:latest
    container_name: procurement-db
    environment:
      MYSQL_DATABASE: procurement_service_db
      MYSQL_USER: procurement_service
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3308:3306"
    volumes:
      - procurement-db-data:/var/lib/mysql
    restart: unless-stopped

  stock-db:
    image: mysql:latest
    container_name: stock-db
    environment:
      MYSQL_DATABASE: stock_service_db
      MYSQL_USER: stock_service
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3309:3306"
    volumes:
      - stock-db-data:/var/lib/mysql
    restart: unless-stopped

  order-db:
    image: mysql:latest
    container_name: order-db
    environment:
      MYSQL_DATABASE: order_service_db
      MYSQL_USER: order_service
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3310:3306"
    volumes:
      - order-db-data:/var/lib/mysql
    restart: unless-stopped

  reports-db:
    image: mysql:latest
    container_name: reports-db
    environment:
      MYSQL_DATABASE: reports_service_db
      MYSQL_USER: reports_service
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3311:3306"
    volumes:
      - reports-db-data:/var/lib/mysql
    restart: unless-stopped

  payment-db:
    image: mysql:latest
    container_name: payment-db
    environment:
      MYSQL_DATABASE: payment_service_db
      MYSQL_USER: payment_service
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3312:3306"
    volumes:
      - payment-db-data:/var/lib/mysql
    restart: unless-stopped

  notification-db:
    image: mysql:latest
    container_name: notification-db
    environment:
      MYSQL_DATABASE: notification_service_db
      MYSQL_USER: notification_service
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3313:3306"
    volumes:
      - notification-db-data:/var/lib/mysql
    restart: unless-stopped

  product-mongodb:
    image: mongo:latest
    container_name: product-mongodb
    ports:
      - "27017:27017"
    volumes:
      - product-mongodb-data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: product_user
      MONGO_INITDB_ROOT_PASSWORD: root
      MONGO_INITDB_DATABASE: product_service_db
    restart: unless-stopped

  cart-redis:
    image: redis:latest 
    container_name: cart-redis
    ports:
      - "6379:6379" 
    volumes:
      - cart-redis-data:/data 
    restart: unless-stopped

  # ============================================================
  # TEMPO - Distributed Tracing
  # ============================================================
  tempo:
    image: grafana/tempo:2.3.1
    container_name: tempo
    command: [ "-config.file=/etc/tempo.yaml" ]
    volumes:
      - ./observability/tempo/tempo.yaml:/etc/tempo.yaml
      - tempo-data:/tmp/tempo
    ports:
      - "3200:3200"   # Grafana consulta aqui
      - "4317:4317"   # Seus serviços Java enviam traces aqui (gRPC)
      - "4318:4318"   # Alternativa HTTP
    restart: unless-stopped

  # ============================================================
  # LOKI - Log Aggregation
  # ============================================================
  loki:
    image: grafana/loki:2.9.3
    container_name: loki
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./observability/loki/loki.yaml:/etc/loki/local-config.yaml
      - loki-data:/loki
    ports:
      - "3100:3100"   # Grafana e Promtail acessam aqui
    restart: unless-stopped

  # ============================================================
  # PROMTAIL - Log Collector
  # ============================================================
  promtail:
    image: grafana/promtail:2.9.3
    container_name: promtail
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./observability/promtail/promtail.yaml:/etc/promtail/config.yml
      # Monta pasta de logs dos seus serviços (vamos configurar depois)
      - ./logs:/var/log/apps:ro
    depends_on:
      - loki
    restart: unless-stopped

  # ============================================================
  # PROMETHEUS - Metrics Collection
  # ============================================================
  prometheus:
    image: prom/prometheus:v2.48.1
    container_name: prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"   # UI do Prometheus (opcional acessar)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped  

  # ============================================================
  # GRAFANA - Visualization
  # ============================================================
  grafana:
    image: grafana/grafana:10.2.3
    container_name: grafana
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor
    volumes:
      - ./observability/grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
      - ./observability/grafana/dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - loki
      - tempo
      - prometheus
    restart: unless-stopped

volumes:
  keycloak-db-data:
  user-db-data:
  procurement-db-data:
  stock-db-data:
  order-db-data:
  reports-db-data:
  payment-db-data:
  notification-db-data:
  product-mongodb-data:
  cart-redis-data:
  tempo-data:
  loki-data:
  prometheus-data:
  grafana-data: