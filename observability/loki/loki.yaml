# ====================================================================
# LOKI CONFIG - Log Aggregation System
# ====================================================================
# O QUE ESTÁ CONFIGURADO AQUI:
# 1. Recebe logs do Promtail
# 2. Indexa por labels (service, level, etc)
# 3. Permite queries rápidas no Grafana
# ====================================================================

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

# Configuração de ingestão de logs
ingester:
  lifecycler:
    address: 127.0.0.1
    ring:
      kvstore:
        store: inmemory
      replication_factor: 1
    final_sleep: 0s
  chunk_idle_period: 5m
  chunk_retain_period: 30s
  max_chunk_age: 1h
  max_transfer_retries: 0
  wal:
    enabled: true
    dir: /loki/wal

# Schema de indexação
schema_config:
  configs:
    - from: 2020-10-24
      store: boltdb-shipper
      object_store: filesystem
      schema: v11
      index:
        prefix: index_
        period: 24h

# Onde armazena os dados
storage_config:
  boltdb_shipper:
    active_index_directory: /loki/boltdb-shipper-active
    cache_location: /loki/boltdb-shipper-cache
    cache_ttl: 24h
    shared_store: filesystem
  filesystem:
    directory: /loki/chunks

# Limites para evitar sobrecarga
limits_config:
  reject_old_samples: true
  reject_old_samples_max_age: 168h  # 1 semana
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32
  max_query_series: 10000
  max_query_parallelism: 32

# Tabelas antigas podem ser deletadas
chunk_store_config:
  max_look_back_period: 168h  # 1 semana de retenção

table_manager:
  retention_deletes_enabled: true
  retention_period: 168h  # 1 semana de retenção

# Permite queries complexas
query_range:
  align_queries_with_step: true
  cache_results: true
  max_retries: 5
  parallelise_shardable_queries: true

# Compactação de dados antigos
compactor:
  working_directory: /loki/boltdb-shipper-compactor
  shared_store: filesystem
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 150
