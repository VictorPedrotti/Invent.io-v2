server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # ============================================================
  # Logs dos serviços Java (rodando no host)
  # ============================================================
  - job_name: app-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: app-logs
          __path__: /var/log/apps/*.log

    # Pipeline para parsear JSON
    pipeline_stages:
      - json:
          expressions:
            service: service
            level: level
            message: message
            timestamp: '"@timestamp"'
      
      - labels:
          service:
          level:
      
      - timestamp:
          source: timestamp
          format: RFC3339Nano